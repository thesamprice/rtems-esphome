name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The submodules use ssh URLs, which a runner has no key for. Rewriting to
# https is done per job rather than in .gitmodules, because the ssh form is the
# right default for a human with a key and the rewrite is a property of the
# environment rather than of the project.
env:
  GIT_HTTPS_REWRITE: 1

jobs:
  # Cheap, needs no toolchain and no emulator, so it fails fast when the
  # dependency surface moves or a submodule has drifted off its pin.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite submodule URLs for a keyless runner
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:' 
      # --checkout is required, not decoration: every submodule here is declared
      # "update = none" so a plain clone stays small, and `submodule update
      # --init` honours that by skipping them entirely. Without it the fetch
      # silently succeeds having fetched nothing.
      - name: Fetch esphome
        run: git submodule update --init --checkout --depth=1 src/esphome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest matches what is recorded
        run: scripts/manifest.sh
      - name: Dependency surface has not moved
        run: scripts/audit_platform_deps.py --check

  # The A side of the A/B: the backend that already works, so a common-code
  # change that breaks it is caught. CONTRIBUTING.md rule 7.
  esp-idf-lane:
    runs-on: ubuntu-latest
    # QEMU comes from the image, already built and with its pc-bios beside it.
    container: ghcr.io/${{ github.repository_owner }}/rtems-esphome-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:' 
      - run: git submodule update --init --checkout --depth=1 src/esphome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ESPHome brings its own ESP-IDF and RISC-V toolchain on first compile.
      # Several minutes, and worth caching on the esphome pin.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ hashFiles('.gitmodules') }}-${{ hashFiles('tests/esp-idf-ci/reference-node.yaml') }}
          restore-keys: esphome-idf-
      - name: Install ESPHome from the pinned source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e src/esphome
      - name: Compile
        working-directory: tests/esp-idf-ci
        run: ../../.venv/bin/esphome compile reference-node.yaml
      - name: Run
        run: |
          tools/esp-idf-ci-run.sh -o esp-idf-results \
            tests/esp-idf-ci/.esphome/build/reference-node/build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-lane-results
          path: esp-idf-results

  # The B side. Needs an RTEMS toolchain, which the RSB builds in tens of
  # minutes, so it is cached on the RSB revision. The first run on a cold cache
  # is long; later ones are not.
  rtems-lane:
    runs-on: ubuntu-latest
    # Toolchain, BSP and QEMU all come from the image. Nothing here builds a
    # compiler; see .github/workflows/toolchain-image.yml.
    container: ghcr.io/${{ github.repository_owner }}/rtems-esphome-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - run: 'git config --global url."https://github.com/".insteadOf git@github.com:' 
      - run: git submodule update --init --checkout --depth=1 src/esphome
      # No setup-python: the image already has 3.12 and a second interpreter
      # only adds PATH confusion.
      - name: Install ESPHome from the pinned source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e src/esphome
      - name: Compile
        working-directory: tests/rtems-ci
        run: |
          ../../.venv/bin/esphome compile reference-node.yaml
          ../../.venv/bin/esphome compile primitives.yaml
          ../../.venv/bin/esphome compile scheduler.yaml
      - name: Run the reference node
        run: |
          tools/rtems-ci-run.sh -o rtems-results/reference \
            tests/rtems-ci/.esphome/build/reference-node/reference-node.bin
      # Both icount modes, because each hides a class of bug the other shows.
      # delay() passed under icount while returning 7ms early; it only failed
      # with icount off. See #46.
      - name: Run the primitives, icount on
        run: |
          tools/rtems-ci-run.sh -o rtems-results/primitives-icount -t 240 \
            -M "PRIMITIVES ok" tests/rtems-ci/.esphome/build/primitives/primitives.bin
      - name: Run the primitives, icount off
        run: |
          tools/rtems-ci-run.sh -o rtems-results/primitives-realtime -t 240 -I \
            -M "PRIMITIVES ok" tests/rtems-ci/.esphome/build/primitives/primitives.bin
      - name: Run the scheduler validation, both ways
        run: |
          tools/rtems-ci-run.sh -o rtems-results/scheduler-icount -t 240 \
            -M "SCHEDULER ok" tests/rtems-ci/.esphome/build/scheduler/scheduler.bin
          tools/rtems-ci-run.sh -o rtems-results/scheduler-realtime -t 240 -I \
            -M "SCHEDULER ok" tests/rtems-ci/.esphome/build/scheduler/scheduler.bin
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtems-lane-results
          path: rtems-results
