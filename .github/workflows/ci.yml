name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The submodules use ssh URLs, which a runner has no key for. Rewriting to
# https is done per job rather than in .gitmodules, because the ssh form is the
# right default for a human with a key and the rewrite is a property of the
# environment rather than of the project.
env:
  GIT_HTTPS_REWRITE: 1

jobs:
  # Cheap, needs no toolchain and no emulator, so it fails fast when the
  # dependency surface moves or a submodule has drifted off its pin.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite submodule URLs for a keyless runner
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:' 
      # --checkout is required, not decoration: every submodule here is declared
      # "update = none" so a plain clone stays small, and `submodule update
      # --init` honours that by skipping them entirely. Without it the fetch
      # silently succeeds having fetched nothing.
      - name: Fetch esphome
        run: git submodule update --init --checkout --depth=1 src/esphome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest matches what is recorded
        run: scripts/manifest.sh
      - name: Dependency surface has not moved
        run: scripts/audit_platform_deps.py --check

  # The A side of the A/B: the backend that already works, so a common-code
  # change that breaks it is caught. CONTRIBUTING.md rule 7.
  esp-idf-lane:
    runs-on: ubuntu-latest
    # QEMU comes from the image, already built and with its pc-bios beside it.
    container: ghcr.io/${{ github.repository_owner }}/rtems-esphome-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      # Two things, and both are properties of running in a container rather
      # than of the project.  actions/checkout runs as the runner user while the
      # job runs as root, so git refuses the tree as dubiously owned; and the
      # submodule URLs are ssh, which a runner has no key for.
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
      - run: git submodule update --init --checkout --depth=1 src/esphome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ESPHome brings its own ESP-IDF and RISC-V toolchain on first compile.
      # Several minutes, and worth caching on the esphome pin.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ hashFiles('.gitmodules') }}-${{ hashFiles('tests/esp-idf-ci/reference-node.yaml') }}
          restore-keys: esphome-idf-
      - name: Install ESPHome from the pinned source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e src/esphome
      - name: Compile
        working-directory: tests/esp-idf-ci
        run: ../../.venv/bin/esphome compile reference-node.yaml
      - name: Run
        run: |
          tools/esp-idf-ci-run.sh -o esp-idf-results \
            tests/esp-idf-ci/.esphome/build/reference-node/build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-lane-results
          path: esp-idf-results

  # The B side. Needs an RTEMS toolchain, which the RSB builds in tens of
  # minutes, so it is cached on the RSB revision. The first run on a cold cache
  # is long; later ones are not.
  rtems-lane:
    runs-on: ubuntu-latest
    # Toolchain, BSP and QEMU all come from the image. Nothing here builds a
    # compiler; see .github/workflows/toolchain-image.yml.
    container: ghcr.io/${{ github.repository_owner }}/rtems-esphome-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      # Two things, and both are properties of running in a container rather
      # than of the project.  actions/checkout runs as the runner user while the
      # job runs as root, so git refuses the tree as dubiously owned; and the
      # submodule URLs are ssh, which a runner has no key for.
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
      - run: git submodule update --init --checkout --depth=1 src/esphome
      # No setup-python: the image already has 3.12 and a second interpreter
      # only adds PATH confusion.
      - name: Install ESPHome from the pinned source
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e src/esphome
      - name: Compile
        working-directory: tests/rtems-ci
        run: |
          ../../.venv/bin/esphome compile reference-node.yaml
          ../../.venv/bin/esphome compile primitives.yaml
          ../../.venv/bin/esphome compile scheduler.yaml
          ../../.venv/bin/esphome compile gpio.yaml
          ../../.venv/bin/esphome compile i2c.yaml
          ../../.venv/bin/esphome compile uart.yaml
          ../../.venv/bin/esphome compile sensor.yaml
          ../../.venv/bin/esphome compile spi.yaml
      - name: Run the reference node
        run: |
          tools/rtems-ci-run.sh -o rtems-results/reference \
            tests/rtems-ci/.esphome/build/reference-node/reference-node.bin
      # Both icount modes, because each hides a class of bug the other shows.
      # delay() passed under icount while returning 7ms early; it only failed
      # with icount off. See #46.
      - name: Run the primitives, icount on
        run: |
          tools/rtems-ci-run.sh -o rtems-results/primitives-icount -t 240 \
            -M "PRIMITIVES ok" tests/rtems-ci/.esphome/build/primitives/primitives.bin
      - name: Run the primitives, icount off
        run: |
          tools/rtems-ci-run.sh -o rtems-results/primitives-realtime -t 240 -I \
            -M "PRIMITIVES ok" tests/rtems-ci/.esphome/build/primitives/primitives.bin
      - name: Run the scheduler validation, both ways
        run: |
          tools/rtems-ci-run.sh -o rtems-results/scheduler-icount -t 240 \
            -M "SCHEDULER ok" tests/rtems-ci/.esphome/build/scheduler/scheduler.bin
          tools/rtems-ci-run.sh -o rtems-results/scheduler-realtime -t 240 -I \
            -M "SCHEDULER ok" tests/rtems-ci/.esphome/build/scheduler/scheduler.bin
      # The driver lanes.  These need the QEMU models in the pinned esp-qemu --
      # the GPIO model and the I2C controller -- which the image already has,
      # so they cost a compile and a few seconds of emulation each.
      - name: Run the GPIO lane
        run: |
          tools/rtems-ci-run.sh -o rtems-results/gpio -t 120 \
            -M "CI-MARKER gpio ok" tests/rtems-ci/.esphome/build/gpio/gpio.bin

      # A real device on the bus, so that "the bus works" is answered by
      # something answering rather than by the driver not complaining.
      - name: Run the I2C lane
        run: |
          tools/rtems-ci-run.sh -o rtems-results/i2c -t 120 \
            -M "CI-MARKER i2c ok" tests/rtems-ci/.esphome/build/i2ctest/i2ctest.bin \
            -- -device tmp105,address=0x48

      # An upstream ESPHome component, unmodified, against a modelled device.
      # The other lanes prove this platform's own pieces; this one proves a
      # component that knows nothing about RTEMS works on it.
      - name: Run the sensor lane
        run: |
          tools/rtems-ci-run.sh -o rtems-results/sensor -t 120 \
            -M "CI-MARKER sensor ok" -Q tests/rtems-ci/sensor-25c.qmp \
            tests/rtems-ci/.esphome/build/sensortest/sensortest.bin \
            -- -device tmp105,address=0x48,id=temp0

      # The BSP tests, which have no ESPHome in them: each drives a driver or a
      # BSP facility directly, so a failure is the BSP's rather than the
      # platform backend's.  They link against the BSP the image ships, which
      # is the artifact this job is really testing.
      #
      # Seconds each -- the whole group costs less than one ESPHome compile --
      # so they run as a group rather than being rationed.
      - name: Run the BSP tests
        run: |
          dd if=/dev/zero of=/tmp/spiflash.img bs=1048576 count=2 2>/dev/null
          fail=0
          tests/run-bsp-test.sh tests/bsp-pin       bsp-results/pin       || fail=1
          tests/run-bsp-test.sh tests/bsp-tick      bsp-results/tick      || fail=1
          tests/run-bsp-test.sh tests/bsp-opendrain bsp-results/opendrain || fail=1
          tests/run-bsp-test.sh tests/bsp-i2c       bsp-results/i2c       -- \
            -device tmp105,address=0x48 || fail=1
          tests/run-bsp-test.sh tests/bsp-gpspi     bsp-results/gpspi     -- \
            -drive file=/tmp/spiflash.img,if=none,format=raw,id=sf0 \
            -device is25lp016d,bus=gpspi2,drive=sf0 || fail=1
          tests/run-bsp-test.sh tests/bsp-spidrv    bsp-results/spidrv    -- \
            -drive file=/tmp/spiflash.img,if=none,format=raw,id=sf1 \
            -device is25lp016d,bus=gpspi2,drive=sf1 || fail=1
          exit $fail

      # An SSI flash on the controller's own bus.  The pin numbers in the YAML
      # do not route it -- the BSP decides which pads GPSPI2 reaches -- so this
      # is the controller, the driver and ESPHome's stack end to end.
      - name: Run the SPI lane
        run: |
          dd if=/dev/zero of=/tmp/spiflash.img bs=1048576 count=2 2>/dev/null
          tools/rtems-ci-run.sh -o rtems-results/spi -t 120 \
            -M "CI-MARKER spi ok" \
            tests/rtems-ci/.esphome/build/spitest/spitest.bin \
            -- -drive file=/tmp/spiflash.img,if=none,format=raw,id=sf0 \
               -device is25lp016d,bus=gpspi2,drive=sf0

      # The far end of UART1 echoes upper-cased, so a port that loops TX back to
      # RX internally -- a real fault -- cannot pass by returning the guest its
      # own bytes.
      - name: Run the UART lane
        run: |
          rm -f /tmp/uart1.sock
          python3 tests/rtems-ci/uart_echo.py /tmp/uart1.sock &
          echo_pid=$!
          for _ in $(seq 1 50); do [ -S /tmp/uart1.sock ] && break; sleep 0.1; done
          tools/rtems-ci-run.sh -o rtems-results/uart -t 120 \
            -M "CI-MARKER uart ok" tests/rtems-ci/.esphome/build/uarttest/uarttest.bin \
            -- -serial unix:/tmp/uart1.sock
          rc=$?
          kill "$echo_pid" 2>/dev/null || true
          exit $rc

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtems-lane-results
          path: rtems-results
