# riscv/esp32c3db -- the Espressif ESP32-C3, a single core RV32IMC, run with
# the "-M esp32c3" machine of the Espressif QEMU fork.
#
# The BSP is upstream RTEMS (bsps/riscv/esp32, spec/build/bsps/riscv/esp32)
# plus the patches in patches/rtems/, which add the GPIO, I2C and UART drivers
# the upstream BSP does not have and fix a chip header's install path and the
# systimer frequency.  scripts/apply_patches.sh applies them.  The C-series
# parts are the whole of the field for
# RTEMS on Espressif silicon: the ESP32, S2 and S3 are Xtensa and RTEMS has no
# Xtensa port, so the RISC-V parts are the only ones that can be targeted at
# all.
#
# The image boots in the ROM's direct boot mode.  It is not an esp_image and
# there is no second stage boot loader: start.S emits the two 0xaedb041d words
# the ROM looks for at flash offset 0, and the ROM jumps to 0x42000008.  So a
# runnable image is objcopy -O binary of the ELF padded to the flash size,
# which is what tools/esp32c3-run-tests.sh builds.
#
# QEMU needs a patch before it can run anything that takes an interrupt.  Its
# interrupt matrix model does not implement the two INTERRUPT_CORE0_INTR_STATUS
# registers the BSP dispatches on, so every interrupt resolves to vector 0 and
# the first clock tick ends the run with a fatal spurious interrupt.
# patches/esp-qemu/ carries the four line fix and scripts/build_esp_qemu.sh
# builds it; docs/bsps/esp32c3/README.md has the analysis.

[riscv/esp32c3db]
BUILD_TESTS = True

# The BSP defaults to the USB Serial/JTAG console, which cannot work under
# QEMU: hw/misc/esp32c3_jtag.c is a stub, its reads return 0 and its writes are
# discarded.  Output would not merely be lost -- esp_uart_output_char() spins
# waiting for USB_SERIAL_JTAG_SERIAL_IN_EP_DATA_FREE, which a stub returning 0
# never sets, so the first character printed would hang the run.  False selects
# the UART0 path, which calls the ROM UART routines and so reaches QEMU's
# -serial.  It is also the right choice for a board whose console is on the
# UART pins.
ESPRESSIF_USE_USB_CONSOLE = False
