# riscv/esp32c3db with a region for code that executes from RAM.
#
# Same BSP as config_esp32c3db.ini, plus ESP32C_IRAM_REGION_SIZE.  Separate
# because the region is not free: the part reaches one SRAM through two
# windows, so every byte reserved for RAM-resident code is a byte taken from
# the heap, and a configuration that needs none should not pay for it.
#
# Needed by anything that must not fetch instructions from flash: a SPI flash
# driver cannot erase the flash it is executing from (#42), and the Espressif
# WiFi libraries put about 40.5 KiB of code in IRAM.  8 KiB here is enough to
# demonstrate the mechanism and to hold a flash driver; WiFi would want
# 0x11000 or so.
#
# tests/bsp-iram checks that a function placed in .fast_text really does link
# into the instruction window and really does run.

[riscv/esp32c3db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = False
# 8 KiB of SRAM addressed through the instruction bus, for code that must not
# execute from flash.  Taken out of the heap, which is why it is not the
# default.
ESP32C_IRAM_REGION_SIZE = 0x2000
