# arm/xilinx_zynq_a9_qemu -- the Xilinx Zynq-7000 Cortex-A9, run with stock
# qemu-system-arm's "-M xilinx-zynq-a9".
#
# The networking lane.  Unlike the ESP32-C3 this part has an Ethernet MAC the
# emulator models -- two Cadence GEMs -- and rtems-lwip drives it with no
# patching, so this is where ESPHome's socket layer, the native API, DNS and
# mDNS are actually exercised.  docs/esp32c3-bsp.md records why the C3 lane
# cannot do that and is a CPU and core portability proof instead.
#
# No patches apply here: patches/rtems/ is all esp32c3 apart from
# 0007-xil-dcache-single-statement.patch, which this BSP does want -- it is the
# Xilinx compatibility shim these drivers share.
#
# The image boots as an ELF through -kernel, not as a flash image, which is why
# tools/zynq-lwip-run.sh exists alongside tools/rtems-ci-run.sh rather than
# being a flag on it.

[arm/xilinx_zynq_a9_qemu]
BUILD_TESTS = False
