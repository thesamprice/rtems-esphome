# Drives a pin through ESPHome's own GPIOPin interface and reads it back.
#
# Separate from reference-node.yaml, like primitives.yaml, because that config
# exists to be identical to the ESP-IDF lane's and adding to it would break the
# comparison it is for.
#
# GPIO4 and GPIO3.  Free pins are a shorter list than it looks on this part: 2,
# 8 and 9 are strapping, 12 to 17 are the SPI flash on every module, 18 and 19
# are USB, 20 and 21 are UART0 which is the console, and 5 and 6 are where the
# BSP's I2C driver routes SDA and SCL.

esphome:
  name: gpio
  includes:
    - gpio_test.h
  on_boot:
    priority: -100
    then:
      - lambda: "rtems_gpio_test::run(id(pin_out), id(pin_in));"

rtems:
  bsp: riscv/esp32c3db

logger:
  level: DEBUG

output:
  - platform: gpio
    id: pin_out
    pin:
      number: 4
      mode:
        output: true

binary_sensor:
  - platform: gpio
    id: pin_in
    name: "Pulled up input"
    pin:
      number: 3
      mode:
        input: true
        pullup: true
